<div class="form-wrapper">
  <form [formGroup]="suggestionForm" (ngSubmit)="onSubmit()">

    
    <div class="form-group">
      <label>Titre :</label>
      <input type="text" formControlName="title" />
      <div *ngIf="title.invalid && title.touched">
        <small *ngIf="title.errors?.['required']">Le titre est obligatoire.</small>
        <small *ngIf="title.errors?.['minlength']">Minimum 5 caractères.</small>
        <small *ngIf="title.errors?.['pattern']">Doit commencer par une majuscule et contenir uniquement des lettres.</small>
      </div>
    </div>

   
    <div class="form-group">
      <label>Description :</label>
      <textarea formControlName="description" rows="4"></textarea>
      <div *ngIf="description.invalid && description.touched">
        <small *ngIf="description.errors?.['required']">La description est obligatoire.</small>
        <small *ngIf="description.errors?.['minlength']">Minimum 30 caractères.</small>
      </div>
    </div>

    
    <div class="form-group">
      <label>Catégorie :</label>
      <select formControlName="category">
        <option value="">-- Sélectionnez une catégorie --</option>
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
      <div *ngIf="category.invalid && category.touched">
        <small *ngIf="category.errors?.['required']">La catégorie est obligatoire.</small>
      </div>
    </div>

    
    <div class="form-group">
      <label>Date :</label>
      <input type="text" formControlName="date" readonly />
    </div>

    <!-- Status -->
    <div class="form-group">
      <label>Status :</label>
      <input type="text" formControlName="status" readonly />
    </div>

    <!-- Bouton -->
    <button type="submit" [disabled]="suggestionForm.invalid">Soumettre</button>

  </form>
</div>
